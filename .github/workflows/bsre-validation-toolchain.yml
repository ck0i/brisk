name: Temporary BSRE offline validation environment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/bsre-validation-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Rust validation components
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Warm BSRE external dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/bsre-prefetch/src
          cat >/tmp/bsre-prefetch/Cargo.toml <<'EOF'
          [package]
          name = "bsre-prefetch"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          anyhow = "1.0"
          bytemuck = "1.24"
          pollster = "0.4"

          [target.'cfg(target_os = "macos")'.dependencies]
          wgpu = { version = "29.0", default-features = false, features = ["std", "parking_lot", "metal", "vulkan-portability", "wgsl"] }

          [target.'cfg(not(target_os = "macos"))'.dependencies]
          wgpu = { version = "29.0", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
          EOF
          printf 'fn main() {}\n' >/tmp/bsre-prefetch/src/main.rs
          cargo fetch --manifest-path /tmp/bsre-prefetch/Cargo.toml

      - name: Prepare software Vulkan packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libllvm20 libvulkan1 mesa-vulkan-drivers vulkan-tools
          mkdir -p /tmp/bsre-export/debs
          cd /tmp/bsre-export/debs
          apt-get download libllvm20 libvulkan1 mesa-vulkan-drivers vulkan-tools
          ICD="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -n 1)"
          test -n "$ICD"
          VK_ICD_FILENAMES="$ICD" vulkaninfo --summary

      - name: Package relocatable environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bsre-export
          SYSROOT="$(rustc --print sysroot)"
          tar -C "$(dirname "$SYSROOT")" -czf /tmp/bsre-export/rust-toolchain.tar.gz "$(basename "$SYSROOT")"
          if [ -d "$HOME/.cargo/registry" ]; then
            tar -C "$HOME/.cargo" -czf /tmp/bsre-export/cargo-registry.tar.gz registry
          fi
          if [ -d "$HOME/.cargo/git" ]; then
            tar -C "$HOME/.cargo" -czf /tmp/bsre-export/cargo-git.tar.gz git
          fi
          sha256sum /tmp/bsre-export/*.tar.gz /tmp/bsre-export/debs/*.deb > /tmp/bsre-export/SHA256SUMS
          find /tmp/bsre-export -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload offline validation environment
        uses: actions/upload-artifact@v4
        with:
          name: bsre-offline-validation-linux-x86_64
          path: /tmp/bsre-export
          compression-level: 0
          retention-days: 1
